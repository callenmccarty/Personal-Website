<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Success</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .success-message {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .success-message h1 {
      color: green;
      margin-bottom: 1rem;
    }

    .success-message p {
      font-size: 1.1rem;
    }

    .success-message a {
      display: inline-block;
      margin-top: 1.5rem;
      color: #007BFF;
      text-decoration: none;
      font-weight: bold;
    }

    .success-message a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="success-message">
    <h1>Thank You!</h1>
    <p>Your message has been received successfully.</p>
    <a href="index.html">Go Back</a>
  </div>
</body>
</html>
